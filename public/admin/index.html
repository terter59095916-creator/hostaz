<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8" />
<title>Admin Panel — Spin the Bottle</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<style>
  :root { --bg:#0f1115; --panel:#171a21; --border:#2a2e38; --text:#e8e8ea; --muted:#9aa0aa; --accent:#5b8def; --danger:#e15b5b; --good:#4caf7d; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: Segoe UI, Arial, sans-serif; background:var(--bg); color:var(--text); }
  header { padding:16px 24px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; }
  header h1 { font-size:18px; margin:0; }
  #logout-btn { background:none; border:1px solid var(--border); color:var(--muted); padding:6px 12px; border-radius:6px; cursor:pointer; }
  main { padding:24px; max-width:1100px; margin:0 auto; }
  .card { background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:16px; margin-bottom:20px; }
  .card h2 { margin-top:0; font-size:15px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; }
  input, select { background:#0f1115; border:1px solid var(--border); color:var(--text); padding:8px 10px; border-radius:6px; }
  button { background:var(--accent); color:white; border:none; padding:8px 14px; border-radius:6px; cursor:pointer; font-size:14px; }
  button.danger { background:var(--danger); }
  button.ghost { background:transparent; border:1px solid var(--border); color:var(--text); }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--border); }
  th { color:var(--muted); font-weight:600; }
  .vip { color:#f5c542; font-weight:600; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .actions button { margin-right:4px; margin-bottom:4px; }
  #login-screen { display:flex; align-items:center; justify-content:center; height:100vh; }
  #login-box { background:var(--panel); border:1px solid var(--border); padding:32px; border-radius:12px; width:320px; }
  #login-box input { width:100%; margin-bottom:10px; }
  #login-box button { width:100%; }
  .err { color:var(--danger); font-size:13px; margin-top:8px; }
  .hidden { display:none !important; }
</style>
</head>
<body>

<div id="login-screen">
  <div id="login-box">
    <h2 style="margin-top:0">Admin Girişi</h2>
    <input id="login-username" placeholder="İstifad?çi adı" />
    <input id="login-password" type="password" placeholder="Parol" />
    <button onclick="login()">Daxil ol</button>
    <div class="err" id="login-error"></div>
  </div>
</div>

<div id="app" class="hidden">
  <header>
    <h1>?? Spin the Bottle — Admin Panel</h1>
    <button onclick="startSeason()">Mövsümü başlat</button>
    <button onclick="endSeason()">Mövsümü bitir</button>
    <button id="logout-btn" onclick="logout()">Çıxış</button>
  </header>

  <main>
    <div class="card">
      <h2>ID Paneli</h2>
      <div class="row">
        <input id="quickid-input" type="number" placeholder="Istifadeci ID" style="width:150px" />
        <button onclick="quickBan()">Ban et</button>
        <button class="ghost" onclick="quickUnban()">Ban-i sil</button>
        <button onclick="quickChangeId()">ID-ni deyis</button>
      </div>
      <div class="err" id="quickid-msg"></div>
    </div>
    <details class="card" open>
      <summary style="cursor:pointer; font-size:15px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; margin-bottom:8px;">Reytinq c?dv?li</summary>
      <div class="row" style="margin-bottom:10px">
        <input id="search-input" placeholder="Axtar (ad, username, telegram id)..." oninput="loadUsers()" />
        <button class="ghost" onclick="loadUsers()">Yenil?</button>
      </div>
      <table>
        <thead>
          <tr>
            <th>ID</th><th>Ad</th><th>Telegram ID</th><th>Xal</th><th>Coin</th><th>Kristal</th><th>Token</th><th>VIP</th><th>Status</th><th>?m?liyyatlar</th>
          </tr>
        </thead>
        <tbody id="users-table"></tbody>
      </table>
    </details>
      <details class="card">
      <summary style="cursor:pointer; font-size:15px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; margin-bottom:8px;">Liderlik L?vh?si (Xala g?r?)</summary>
      <div class="row" style="margin-bottom:10px">
        <input id="leaderboard-search" placeholder="ID ile axtar..." oninput="loadLeaderboard()" style="width:120px" />
        <button class="ghost" onclick="loadLeaderboard()">Yenil?</button>
      </div>
      <table>
        <thead>
          <tr>
            <th>Sıra</th><th>Ad</th><th>Opus</th><th>Mahni</th><th>Qiymet</th><th>Herem Qiymeti</th><th>Smaylik</th><th>?m?liyyatlar</th></tr>
        </thead>
        <tbody id="leaderboard-table"></tbody>
      </table>
    </details></main>
</div>

<script>
const API = ''; // eyni domend? işl?diyi üçün boş saxlayın
let token = localStorage.getItem('admin_token') || null;

function showApp() {
  document.getElementById('login-screen').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  loadUsers();
  loadLeaderboard();
}

if (token) showApp();

async function login() {
  const username = document.getElementById('login-username').value.trim();
  const password = document.getElementById('login-password').value;
  const errBox = document.getElementById('login-error');
  errBox.textContent = '';
  try {
    const res = await fetch(API + '/api/admin/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password }),
    });
    const data = await res.json();
    if (!res.ok) { errBox.textContent = 'Giriş x?tası: ' + (data.error || 'bilinmir'); return; }
    token = data.token;
    localStorage.setItem('admin_token', token);
    showApp();
  } catch (e) {
    errBox.textContent = 'Server il? ?laq? x?tası';
  }
}

function logout() {
  localStorage.removeItem('admin_token');
  token = null;
  location.reload();
}

async function authFetch(url, opts = {}) {
  opts.headers = Object.assign({}, opts.headers, {
    'Authorization': 'Bearer ' + token,
    'Content-Type': 'application/json',
  });
  const res = await fetch(API + url, opts);
  if (res.status === 401) { logout(); throw new Error('unauthorized'); }
  return res.json();
}

async function loadUsers() {
  const q = document.getElementById('search-input').value.trim();
  const users = await authFetch('/api/admin/users?q=' + encodeURIComponent(q));
  const tbody = document.getElementById('users-table');
  tbody.innerHTML = '';
  users.forEach(u => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${u.id}</td>
      <td>${u.display_name || u.username || '-'}</td>
      <td>${u.telegram_id || '-'}</td>
      <td>${u.points}</td>
      <td>${u.coins}</td><td>${u.crystals}</td><td>${u.tokens || 0}</td>
      <td class="${u.is_vip ? 'vip' : ''}">${u.is_vip ? 'VIP ?' : '-'}</td>
      <td>${u.is_banned ? '?? Bloklu' : '? Aktiv'}</td>
      <td class="actions">
        <button onclick="promptPoints(${u.id})">+/- Xal</button>
        <button onclick="promptCoins(${u.id})">+/- Coin</button>
        <button onclick="promptCrystals(${u.id})">+/- Kristal</button>
        <button onclick="grantPass(${u.id})">Pass ver</button>
        <button onclick="toggleVip(${u.id}, ${u.is_vip ? 0 : 1})">${u.is_vip ? 'VIP l?ğv et' : 'VIP ver'}</button>
        <button class="danger" onclick="toggleBan(${u.id}, ${u.is_banned ? 0 : 1})">${u.is_banned ? 'Blokdan çıxar' : 'Blokla'}</button>
        <button class="danger" onclick="deleteUser(${u.id})">Tam sil</button>
        <button onclick="showRelatedAccounts(${u.id})">🔗 Əlaqəli hesablar</button>
        <button class="danger" onclick="banDevice(${u.id})">📵 Cihazı banla</button>
      </td>
    `;
    tbody.appendChild(tr);
  });
}

async function deleteUser(id) {
  if (!confirm('Bu istifadəçini və bütün əlaqəli məlumatlarını (dostlar, mesajlar, liderlik cədvəli qıları) HƎMİŞƎLİK silmək istəyirsinizmi? Bu əməliyyat GERİ ALİNA BiLMƎZ.')) return;
  await authFetch(`/api/admin/users/${id}`, { method: 'DELETE' });
  loadUsers();
}
async function showRelatedAccounts(id) {
  const related = await authFetch(`/api/admin/related-accounts/${id}`);
  if (!related.length) { alert('Bu istifadəçi ilə eyni IP-dən giriş etmiş başqa hesab tapılmadı.'); return; }
  const list = related.map(u => `#${u.id} - ${u.display_name || u.username}${u.is_banned ? ' (BLOKLU)' : ''}`).join('\n');
  alert('Eyni IP-dən giriş etmiş hesablar:\n\n' + list);
}
async function banDevice(id) {
  if (!confirm('Bu istifadəçinin CIHAZINI banlamaq istəyirsinizmi? Bu cihazdan hiç bir hesabla giriş/qeydiyyat mümkün olmayacaq.')) return;
  const result = await authFetch(`/api/admin/ban-device/${id}`, { method: 'POST' });
  if (result.error === 'no_device_found') { alert('Bu istifadəçi üçün cihaz məlumatı tapılmadı.'); return; }
  alert('Cihaz banlandı (' + result.banned_count + ' cihaz).');
}
async function promptPoints(id) {
  const amount = prompt('Neç? xal ?lav?/çıxarılsın? (m?nfi ?d?d çıxarmaq üçün, m?s: -10)');
  if (amount === null || amount === '') return;
  await authFetch(`/api/admin/users/${id}/points`, {
    method: 'POST',
    body: JSON.stringify({ amount: Number(amount), reason: 'admin_manual' }),
  });
  loadUsers();
}

async function toggleModerator(id, makeModerator) {
  await authFetch(`/api/admin/users/${id}/moderator`, {
    method: 'POST',
    body: JSON.stringify({ is_moderator: makeModerator === 'true' }),
  });
  loadUsers();
}
async function promptCoins(id) {
  const amount = prompt('Neç? coin ?lav?/çıxarılsın?');
  if (amount === null || amount === '') return;
  if (isNaN(Number(amount))) { alert('Yalnız r?q?m yazın (m?s: 100 v? ya -50)'); return; }
  await authFetch(`/api/admin/users/${id}/coins`, {
    method: 'POST',
    body: JSON.stringify({ amount: Number(amount), reason: 'admin_manual' }),
  });
  loadUsers();
}

async function promptCrystals(id) {
  const amount = prompt('Neç? kristal ?lav?/çıxarılsın?');
  if (amount === null || amount === '') return;
  await authFetch(`/api/admin/users/${id}/crystals`, {
    method: 'POST',
    body: JSON.stringify({ amount: Number(amount), reason: 'admin_manual' }),
  });
  loadUsers();
}

async function promptKisses(id) {
  const amount = prompt('Neç? öpüş ?lav?/çıxarılsın?');
  if (amount === null || amount === '') return;
  await authFetch(`/api/admin/users/${id}/kisses`, {
    method: 'POST',
    body: JSON.stringify({ amount: Number(amount) }),
  });
  loadLeaderboard();
}
async function promptGestures(id) {
  const amount = prompt('Neç? smaylik ?lav?/çıxarılsın?');
  if (amount === null || amount === '') return;
  await authFetch(`/api/admin/users/${id}/gestures`, {
    method: 'POST',
    body: JSON.stringify({ amount: Number(amount) }),
  });
  loadLeaderboard();
}

async function promptDjScore(id) {
  const amount = prompt('Neç? Mahnı xalı ?lav?/çıxarılsın?');
  if (amount === null || amount === '') return;
  await authFetch(`/api/admin/users/${id}/dj-score`, {
    method: 'POST',
    body: JSON.stringify({ amount: Number(amount) }),
  });
  loadLeaderboard();
}
async function promptPrice(id) {
  const amount = prompt('Neç? Qiym?t ?lav?/çıxarılsın?');
  if (amount === null || amount === '') return;
  await authFetch(`/api/admin/users/${id}/price`, {
    method: 'POST',
    body: JSON.stringify({ amount: Number(amount) }),
  });
  loadLeaderboard();
}

async function promptHaremPrice(id) {
  const amount = prompt('Neç? H?r?m Qiym?ti ?lav?/çıxarılsın?');
  if (amount === null || amount === '') return;
  await authFetch(`/api/admin/users/${id}/harem-price`, {
    method: 'POST',
    body: JSON.stringify({ amount: Number(amount) }),
  });
  loadLeaderboard();
}
async function resetKisses(id) {
  if (!confirm('Bu istifad?çinin öpüş sayı sıfırlansın?')) return;
  await authFetch(`/api/admin/users/${id}/kisses-reset`, { method: 'POST' });
  loadLeaderboard();
}

async function grantPass(id) {
  if (!confirm('Bu istifadeciye bu movsum ucun Premium Pass verilsin?')) return;
  await authFetch(`/api/admin/users/${id}/grant-pass`, { method: 'POST' });
  alert('Pass verildi');
}
async function startSeason() {
  if (!confirm('Yeni movsum indi baslasin?')) return;
  await authFetch('/api/admin/pass/start-season', { method: 'POST' });
  alert('Movsum baslandi');
}
async function endSeason() {
  if (!confirm('Movsum indi bitsin?')) return;
  await authFetch('/api/admin/pass/end-season', { method: 'POST' });
  alert('Movsum bitirildi');
}

async function toggleVip(id, makeVip) {
  let until = null;
  if (makeVip) {
    const days = prompt('Neç? gün üçün VIP verilsin?', '30');
    if (days === null) return;
    const d = new Date();
    d.setDate(d.getDate() + Number(days));
    until = d.toISOString();
  }
  await authFetch(`/api/admin/users/${id}/vip`, {
    method: 'POST',
    body: JSON.stringify({ until }),
  });
  loadUsers();
}

async function quickBan() {
  const id = document.getElementById('quickid-input').value.trim();
  if (!id) return;
  const hoursStr = prompt('Neçe saat ucun ban? Omurluk ucun bos buraxin:', '');
  const hours = hoursStr && hoursStr.trim() ? Number(hoursStr.trim()) : null;
  try {
    await authFetch(`/api/admin/users/${id}/ban`, { method: 'POST', body: JSON.stringify({ banned: true, hours: hours }) });
    document.getElementById('quickid-msg').style.color = '#4caf7d';
    document.getElementById('quickid-msg').textContent = 'ID ' + id + ' banlandi';
    loadUsers();
  } catch (e) {
    document.getElementById('quickid-msg').style.color = '#e15b5b';
    document.getElementById('quickid-msg').textContent = 'Xeta: ' + e.message;
  }
}
async function quickUnban() {
  const id = document.getElementById('quickid-input').value.trim();
  if (!id) return;
  try {
    await authFetch(`/api/admin/users/${id}/ban`, { method: 'POST', body: JSON.stringify({ banned: false }) });
    document.getElementById('quickid-msg').style.color = '#4caf7d';
    document.getElementById('quickid-msg').textContent = 'ID ' + id + ' banı silindi';
    loadUsers();
  } catch (e) {
    document.getElementById('quickid-msg').style.color = '#e15b5b';
    document.getElementById('quickid-msg').textContent = 'Xeta: ' + e.message;
  }
}
async function quickChangeId() {
  const oldId = document.getElementById('quickid-input').value.trim();
  if (!oldId) return;
  const newId = prompt('Yeni ID daxil edin:');
  if (!newId) return;
  try {
    const result = await authFetch(`/api/admin/users/${oldId}/change-id`, { method: 'POST', body: JSON.stringify({ new_id: newId }) });
    document.getElementById('quickid-msg').style.color = '#4caf7d';
    document.getElementById('quickid-msg').textContent = result.message || 'ID deyisdirildi';
    loadUsers();
  } catch (e) {
    document.getElementById('quickid-msg').style.color = '#e15b5b';
    document.getElementById('quickid-msg').textContent = 'Xeta: ' + e.message;
  }
}
async function toggleBan(id, banned) {
  await authFetch(`/api/admin/users/${id}/ban`, {
    method: 'POST',
    body: JSON.stringify({ banned: !!banned }),
  });
  loadUsers();
}

async function loadLeaderboard() {
  const lq = document.getElementById('leaderboard-search') ? document.getElementById('leaderboard-search').value.trim() : '';
  const rows = await authFetch('/api/admin/leaderboard?q=' + encodeURIComponent(lq));
  const tbody = document.getElementById('leaderboard-table');
  tbody.innerHTML = '';
  rows.forEach((u, idx) => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${idx + 1}</td>
      <td>${u.display_name || u.username || '-'}</td>
      <td>${u.total_kisses || 0}</td>
      <td>${u.points || 0}</td>
      <td>${u.price_stat || 0}</td>
      <td>${u.harem_price_stat || 0}</td>
      <td>${u.gestures_sent || 0}</td>
      <td class="actions">
        <button onclick="promptKisses(${u.id})">+/- Opus</button>
        <button onclick="resetKisses(${u.id})">Opusu sifirla</button>
        <button onclick="promptDjScore(${u.id})">+/- Mahni</button>
        <button onclick="promptPrice(${u.id})">+/- Qiymet</button>
        <button onclick="promptHaremPrice(${u.id})">+/- Herem Qiymeti</button>
        <button onclick="promptGestures(${u.id})">+/- Smaylik</button>
        <button onclick="toggleModerator(${u.id}, ${u.is_moderator ? 'false' : 'true'})">${u.is_moderator ? 'Moderatoru sil' : 'Moderator et'}</button>
      </td>
    `;
    tbody.appendChild(tr);
  });
}</script>
<div style="max-width:900px;margin:30px auto;padding:16px;background:#1a1a1a;border-radius:10px;color:#eee;font-family:Arial;">
  <h2 style="margin-bottom:14px;">Dostluq Sorgulari (Tesdiq gozleyir)</h2>
  <div id="pendingFriendshipsList"></div>
  <h2 style="margin:24px 0 14px;">Butun Wexsi Mesajlar</h2>
  <div id="allMessagesList" style="max-height:400px;overflow-y:auto;"></div>
</div>
<script>
(function() {
  async function loadPendingFriendships() {
    const res = await fetch('/api/admin/pending-friendships');
    const list = await res.json();
    document.getElementById('pendingFriendshipsList').innerHTML = list.length ? list.map(f =>
      '<div style="background:#252525;padding:10px 14px;border-radius:8px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;">' +
        '<span>' + f.user1.name + ' &#8596; ' + f.user2.name + '</span>' +
        '<span><button onclick="approveFriendship(' + f.user_id + ',' + f.friend_id + ')" style="background:#4caf50;color:white;border:none;padding:6px 12px;border-radius:6px;cursor:pointer;margin-right:6px;">Tesdiqle</button>' +
        '<button onclick="rejectFriendship(' + f.user_id + ',' + f.friend_id + ')" style="background:#e53935;color:white;border:none;padding:6px 12px;border-radius:6px;cursor:pointer;">Redd et</button></span>' +
      '</div>'
    ).join('') : '<p style="color:#888;">Gozleyen sorgu yoxdur</p>';
  }
  window.approveFriendship = async function(userId, friendId) {
    await fetch('/api/admin/friendship-decision/' + userId + '/' + friendId, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ approve: true }) });
    loadPendingFriendships();
  };
  window.rejectFriendship = async function(userId, friendId) {
    await fetch('/api/admin/friendship-decision/' + userId + '/' + friendId, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ approve: false }) });
    loadPendingFriendships();
  };
  async function loadAllMessages() {
    const res = await fetch('/api/admin/all-messages');
    const list = await res.json();
    document.getElementById('allMessagesList').innerHTML = list.length ? list.map(m =>
      '<div style="padding:6px 10px;border-bottom:1px solid #333;font-size:13px;"><b>' + m.sender.name + ' &#8594; ' + m.receiver.name + ':</b> ' + m.text + ' <span style="color:#666;">(' + m.created_at + ')</span></div>'
    ).join('') : '<p style="color:#888;">Mesaj yoxdur</p>';
  }
  loadPendingFriendships();
  loadAllMessages();
  setInterval(loadPendingFriendships, 10000);
})();
</script></body>
</html>
