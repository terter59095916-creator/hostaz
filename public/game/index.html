<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8" />
<title>Spin the Bottle</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; height:100%; overflow:hidden; background:#1b3a2a; font-family: Arial, Helvetica, sans-serif; color:white; }

  #game-screen { position:relative; width:100%; height:100%; display:flex; flex-direction:column; }

  #top-bar { display:flex; justify-content:space-between; align-items:center; padding:10px 14px; background:rgba(0,0,0,0.25); font-size:13px; z-index:5; }
  #top-bar .stat { display:flex; gap:12px; }

  #table-area { position:relative; flex:1; display:flex; align-items:center; justify-content:center; }
  #table-circle {
    width:min(88vw, 400px); height:min(88vw, 400px); border-radius:50%;
    background: radial-gradient(circle at 40% 35%, #6b4a2f, #4a3220 70%, #2f1f14);
    box-shadow: inset 0 0 40px rgba(0,0,0,0.5), 0 10px 30px rgba(0,0,0,0.4);
  }

  #bottle-wrap { position:absolute; top:50%; left:50%; width:44px; height:120px; margin-left:-22px; margin-top:-60px; pointer-events:none; }
  #bottle-wrap img { width:100%; height:100%; object-fit:contain; transform-origin:50% 50%; transition: transform 3.2s cubic-bezier(.15,.65,.15,1); filter: drop-shadow(0 4px 8px rgba(0,0,0,0.4)); }

  .seat { position:absolute; width:64px; height:64px; text-align:center; cursor:pointer; }
  .seat .avatar { width:56px; height:56px; border-radius:50%; background:#345; border:3px solid rgba(255,255,255,0.5); display:flex; align-items:center; justify-content:center; font-size:22px; overflow:hidden; position:relative; transition:border-color .15s, box-shadow .15s; }
  .seat .name { font-size:11px; margin-top:2px; text-shadow:0 1px 2px black; white-space:nowrap; max-width:70px; overflow:hidden; text-overflow:ellipsis; margin-left:auto; margin-right:auto; }
  .seat.target .avatar { border-color:#f5c542; box-shadow:0 0 16px #f5c542; }
  .seat.selected .avatar { border-color:#5b8def; box-shadow:0 0 16px #5b8def; }
  .seat.vip .name { color:#f5c542; }
  .seat .gift-float { position:absolute; left:50%; top:-10px; width:30px; height:30px; transform:translateX(-50%); opacity:0; pointer-events:none; }
  .seat .gift-float.play { animation: giftFloat 1.6s ease-out forwards; }
  @keyframes giftFloat {
    0%   { opacity:0; transform:translate(-50%, 0) scale(0.6); }
    15%  { opacity:1; transform:translate(-50%, -10px) scale(1.1); }
    70%  { opacity:1; transform:translate(-50%, -40px) scale(1); }
    100% { opacity:0; transform:translate(-50%, -60px) scale(0.9); }
  }

  #hint { position:absolute; top:44px; left:50%; transform:translateX(-50%); font-size:12px; color:rgba(255,255,255,0.7); z-index:5; text-align:center; padding:0 12px; }

  #bottom-controls { position:relative; padding:10px 10px 14px; display:flex; flex-direction:column; align-items:center; gap:10px; z-index:5; }

  #gift-bar { display:flex; gap:8px; overflow-x:auto; max-width:100%; padding:4px; }
  #gift-bar .gift-btn { flex:0 0 auto; width:46px; height:46px; border-radius:10px; background:rgba(255,255,255,0.08); border:2px solid transparent; display:flex; align-items:center; justify-content:center; cursor:pointer; }
  #gift-bar .gift-btn img { width:30px; height:30px; object-fit:contain; }

  #spin-btn { padding:12px 28px; border:none; border-radius:30px; background:#e15b5b; color:white; font-size:16px; font-weight:bold; cursor:pointer; box-shadow:0 6px 16px rgba(0,0,0,0.35); }
  #spin-btn:disabled { opacity:0.5; cursor:default; }

  #chat-toggle { position:absolute; right:14px; bottom:14px; width:46px; height:46px; border-radius:50%; background:rgba(0,0,0,0.4); border:none; color:white; font-size:20px; cursor:pointer; z-index:6; }
  #chat-panel { position:absolute; right:0; bottom:0; width:280px; max-width:90vw; height:60%; background:rgba(10,20,15,0.94); border-top-left-radius:14px; display:flex; flex-direction:column; transform:translateY(100%); transition:transform .25s ease; z-index:6; }
  #chat-panel.open { transform:translateY(0); }
  #chat-messages { flex:1; overflow-y:auto; padding:10px; font-size:13px; }
  #chat-messages .msg { margin-bottom:6px; }
  #chat-messages .msg b { color:#8fd0a6; }
  #chat-messages .msg.gift-msg { color:#f5c542; font-style:italic; }
  #chat-input-row { display:flex; padding:8px; gap:6px; border-top:1px solid rgba(255,255,255,0.1); }
  #chat-input-row input { flex:1; border:none; border-radius:8px; padding:8px 10px; background:rgba(255,255,255,0.1); color:white; }
  #chat-input-row input::placeholder { color:rgba(255,255,255,0.5); }
  #chat-input-row button { border:none; border-radius:8px; padding:8px 12px; background:#5b8def; color:white; cursor:pointer; }

  #toast { position:absolute; top:70px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,0.75); padding:8px 16px; border-radius:20px; font-size:13px; opacity:0; transition:opacity .3s; pointer-events:none; z-index:7; }
  #toast.show { opacity:1; }
</style>
</head>
<body>

<div id="game-screen">
  <div id="top-bar">
    <div class="stat">🍾 Otaq: <span id="room-name">-</span></div>
    <div class="stat">⭐ Xal: <span id="my-points">0</span></div>
  </div>
  <div id="hint">Hədiyyə göndərmək üçün əvvəlcə oyunçuya toxunun, sonra hədiyyə seçin</div>

  <div id="table-area">
    <div id="table-circle"></div>
    <div id="seats"></div>
    <div id="bottle-wrap">
      <img id="bottle-img" src="/assets/original/bottle.svg" alt="bottle" />
    </div>
  </div>

  <div id="toast"></div>

  <div id="bottom-controls">
    <div id="gift-bar"></div>
    <button id="spin-btn" onclick="spin()">🍾 Şüşəni fırlat</button>
  </div>

  <button id="chat-toggle" onclick="toggleChat()">💬</button>
  <div id="chat-panel">
    <div id="chat-messages"></div>
    <div id="chat-input-row">
      <input id="chat-input" placeholder="Mesaj yaz..." onkeydown="if(event.key==='Enter') sendChat()" />
      <button onclick="sendChat()">Göndər</button>
    </div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { tg.ready(); tg.expand(); }
  const tgUser = tg && tg.initDataUnsafe && tg.initDataUnsafe.user;

  const urlParams = new URLSearchParams(location.search);
  const roomId = urlParams.get('room') || 'lobby-1';
  const telegramId = tgUser ? String(tgUser.id) : ('guest-' + Math.floor(Math.random() * 100000));
  const displayName = tgUser ? (tgUser.first_name || 'Oyunçu') : ('Qonaq ' + telegramId.slice(-4));
  const avatarUrl = tgUser && tgUser.photo_url ? tgUser.photo_url : '';

  document.getElementById('room-name').textContent = roomId;

  // Öz orijinal hədiyyə ikonlarımız (SVG, tam bizim öz dizaynımız)
  const GIFTS = [
    { id: 'rose', file: 'rose.svg' },
    { id: 'heart', file: 'heart.svg' },
    { id: 'crown', file: 'crown.svg' },
    { id: 'champagne', file: 'champagne.svg' },
    { id: 'star', file: 'star.svg' },
  ];

  function initGiftBar() {
    const bar = document.getElementById('gift-bar');
    bar.innerHTML = '';
    GIFTS.forEach(g => {
      const btn = document.createElement('div');
      btn.className = 'gift-btn';
      btn.id = 'gift-' + g.id;
      btn.innerHTML = `<img src="/assets/original/gifts/${g.file}" />`;
      btn.onclick = () => sendGift(g.id);
      bar.appendChild(btn);
    });
  }
  initGiftBar();

  // ---- Sadə səs effektləri (Web Audio ilə, öz sintezimiz, xarici fayl lazım deyil) ----
  let audioCtx = null;
  function beep(freq, duration, type = 'sine') {
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    } catch (e) {}
  }
  function playSpinSound() {
    let n = 0;
    const iv = setInterval(() => { beep(300 + Math.random() * 200, 0.08, 'triangle'); if (++n > 14) clearInterval(iv); }, 200);
  }
  function playResultSound() { beep(660, 0.15); setTimeout(() => beep(880, 0.2), 120); }
  function playGiftSound() { beep(990, 0.12); setTimeout(() => beep(1320, 0.18), 100); }

  const socket = io();
  let mySeatId = null;
  let seatOrder = [];
  let selectedTargetId = null;

  socket.on('connect', () => {
    socket.emit('join_room', { roomId, telegramId, username: telegramId, displayName, avatarUrl });
  });

  socket.on('joined', (data) => {
    mySeatId = data.userId;
    document.getElementById('my-points').textContent = data.points;
  });

  socket.on('error_message', (data) => showToast('Xəta: ' + data.error));
  socket.on('room_update', (state) => renderSeats(state.players));

  socket.on('bottle_spinning', (data) => {
    document.getElementById('spin-btn').disabled = true;
    playSpinSound();
    spinBottleAnimation(data.targetId);
  });

  socket.on('spin_result', (data) => {
    document.getElementById('spin-btn').disabled = false;
    playResultSound();
    highlightTarget(data.targetId);
    showToast(data.spinnerId === mySeatId ? '🎯 Sən fırlatdın!' : 'Şüşə fırlandı!');
  });

  socket.on('gift_received', (data) => {
    playGiftSound();
    const seat = document.getElementById('seat-' + data.targetId);
    if (seat) {
      const gift = GIFTS.find(g => g.id === data.giftId);
      const img = document.createElement('img');
      img.className = 'gift-float';
      img.src = gift ? `/assets/original/gifts/${gift.file}` : '';
      seat.appendChild(img);
      requestAnimationFrame(() => img.classList.add('play'));
      setTimeout(() => img.remove(), 1700);
    }
    const box = document.getElementById('chat-messages');
    const div = document.createElement('div');
    div.className = 'msg gift-msg';
    div.textContent = `🎁 ${data.fromName} hədiyyə göndərdi`;
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
  });

  socket.on('chat_message', (data) => {
    const box = document.getElementById('chat-messages');
    const div = document.createElement('div');
    div.className = 'msg';
    div.innerHTML = `<b>${escapeHtml(data.name)}:</b> ${escapeHtml(data.text)}`;
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
  });

  function spin() { socket.emit('spin_bottle'); }

  function sendGift(giftId) {
    if (!selectedTargetId) { showToast('Əvvəlcə oyunçu seçin (üzərinə toxunun)'); return; }
    if (selectedTargetId === mySeatId) { showToast('Özünə hədiyyə göndərə bilməzsən 🙂'); return; }
    socket.emit('send_gift', { targetId: selectedTargetId, giftId });
  }

  function selectSeat(id) {
    selectedTargetId = (selectedTargetId === id) ? null : id;
    document.querySelectorAll('.seat').forEach(el => el.classList.remove('selected'));
    if (selectedTargetId) {
      const el = document.getElementById('seat-' + selectedTargetId);
      if (el) el.classList.add('selected');
    }
  }

  function sendChat() {
    const input = document.getElementById('chat-input');
    const text = input.value.trim();
    if (!text) return;
    socket.emit('chat_message', { text });
    input.value = '';
  }

  function toggleChat() { document.getElementById('chat-panel').classList.toggle('open'); }

  function showToast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 2500);
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function renderSeats(players) {
    seatOrder = players.map(p => p.id);
    const container = document.getElementById('seats');
    container.innerHTML = '';
    const tableArea = document.getElementById('table-area');
    const radius = Math.min(tableArea.clientWidth, tableArea.clientHeight) / 2 - 40;
    const cx = tableArea.clientWidth / 2;
    const cy = tableArea.clientHeight / 2;
    const n = Math.max(players.length, 1);

    players.forEach((p, i) => {
      const angle = (i / n) * 2 * Math.PI - Math.PI / 2;
      const x = cx + radius * Math.cos(angle);
      const y = cy + radius * Math.sin(angle);

      const seat = document.createElement('div');
      seat.className = 'seat' + (p.isVip ? ' vip' : '') + (p.id === selectedTargetId ? ' selected' : '');
      seat.id = 'seat-' + p.id;
      seat.style.left = (x - 32) + 'px';
      seat.style.top = (y - 32) + 'px';
      seat.onclick = () => selectSeat(p.id);
      seat.innerHTML = `
        <div class="avatar">${p.avatar ? `<img src="${p.avatar}" style="width:100%;height:100%;object-fit:cover;">` : '🙂'}</div>
        <div class="name">${escapeHtml(p.name)}${p.id === mySeatId ? ' (sən)' : ''}</div>
      `;
      container.appendChild(seat);
    });
  }

  function highlightTarget(targetId) {
    document.querySelectorAll('.seat').forEach(el => el.classList.remove('target'));
    const el = document.getElementById('seat-' + targetId);
    if (el) el.classList.add('target');
  }

  let currentRotation = 0;
  function spinBottleAnimation(targetId) {
    const targetIndex = seatOrder.indexOf(targetId);
    const n = seatOrder.length || 1;
    const targetAngleDeg = (targetIndex / n) * 360;
    const extraSpins = 4 * 360;
    currentRotation += extraSpins + targetAngleDeg;
    document.getElementById('bottle-img').style.transform = `rotate(${currentRotation}deg)`;
  }
</script>
</body>
</html>
