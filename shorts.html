<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Qisa Videolar</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: black; }
  body { font-family: Arial, sans-serif; }
  .top-bar { position: fixed; top: 0; left: 0; right: 0; z-index: 20; display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; }
  .top-bar a { color: white; text-decoration: none; font-weight: bold; font-size: 20px; text-shadow: 0 1px 3px rgba(0,0,0,0.5); }
  .upload-btn { background: rgba(255,255,255,0.2); color: white; border: none; padding: 8px 16px; border-radius: 20px; cursor: pointer; font-weight: bold; }
  .shorts-container { height: 100vh; overflow-y: scroll; scroll-snap-type: y mandatory; }
  .short-item { height: 100vh; scroll-snap-align: start; position: relative; display: flex; align-items: center; justify-content: center; background: #111; }
  .short-item video { width: 100%; height: 100%; object-fit: contain; }
  .short-overlay { position: absolute; bottom: 0; left: 0; right: 80px; padding: 20px; color: white; background: linear-gradient(transparent, rgba(0,0,0,0.7)); }
  .short-user { font-weight: bold; margin-bottom: 6px; }
  .short-caption { font-size: 14px; }
  .short-actions { position: absolute; right: 12px; bottom: 100px; display: flex; flex-direction: column; gap: 20px; align-items: center; }
  .short-actions button { background: rgba(255,255,255,0.15); border: none; color: white; width: 48px; height: 48px; border-radius: 50%; font-size: 22px; cursor: pointer; }
  .short-actions button.liked { color: #ff7a00; }
  .short-actions .count { color: white; font-size: 12px; text-shadow: 0 1px 2px rgba(0,0,0,0.5); }
  .upload-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 30; align-items: center; justify-content: center; flex-direction: column; gap: 12px; padding: 20px; }
  .upload-modal.open { display: flex; }
  .upload-modal input, .upload-modal textarea { width: 100%; max-width: 320px; padding: 10px; border-radius: 6px; border: none; }
  .upload-modal button { background: #ff7a00; color: white; border: none; padding: 10px 24px; border-radius: 20px; cursor: pointer; font-weight: bold; }
  .comments-panel { display: none; position: fixed; bottom: 0; left: 0; right: 0; max-height: 60vh; background: white; border-radius: 16px 16px 0 0; z-index: 25; padding: 16px; overflow-y: auto; }
  .comments-panel.open { display: block; }
  .comment-row { padding: 6px 0; font-size: 14px; border-bottom: 1px solid #f0f0f0; }
  .comment-input-row { display: flex; gap: 6px; margin-top: 10px; }
  .comment-input-row input { flex: 1; padding: 8px 12px; border: 1px solid #ddd; border-radius: 20px; }
  .comment-input-row button { background: #ff7a00; color: white; border: none; padding: 8px 16px; border-radius: 20px; cursor: pointer; }
</style>
</head>
<body>
  <div class="top-bar">
    <a href="/feed">&#8592; Lent</a>
    <button class="upload-btn" onclick="openUpload()">+ Video</button>
  </div>
  <div class="shorts-container" id="shortsContainer"></div>
  <div class="upload-modal" id="uploadModal">
    <input type="file" id="videoInput" accept="video/*">
    <textarea id="captionInput" placeholder="Aciqlama yaz..." rows="2"></textarea>
    <button onclick="submitUpload()">Paylas</button>
    <button onclick="closeUpload()" style="background:#666;">Legv et</button>
  </div>
  <div class="comments-panel" id="commentsPanel">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;"><b>Serhler</b><button onclick="closeComments()" style="background:none;border:none;font-size:18px;cursor:pointer;">&times;</button></div>
    <div id="commentsListShort"></div>
    <div class="comment-input-row"><input type="text" id="shortCommentInput"><button onclick="submitShortComment()">Gonder</button></div>
  </div>
<script>
  const token = localStorage.getItem('authToken');
  let myUserId = null;
  try { myUserId = JSON.parse(atob(token.split('.')[1])).id; } catch (e) {}
  if (!token) window.location.href = '/login';
  let currentShortId = null;
  async function apiCall(url, method, body) {
    const res = await fetch(url, { method: method || 'GET', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token }, body: body ? JSON.stringify(body) : undefined });
    return res.json();
  }
  function escapeHtml(s) { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }
  async function loadShorts() {
    const shorts = await apiCall('/api/shorts');
    const container = document.getElementById('shortsContainer');
    container.innerHTML = shorts.map(s => {
      return '<div class="short-item"><video src="' + s.url + '" loop playsinline muted onclick="togglePlay(this)"></video>' +
        '<div class="short-overlay"><div class="short-user">' + escapeHtml(s.user.display_name || s.user.username) + '</div><div class="short-caption">' + escapeHtml(s.caption || '') + '</div></div>' +
        '<div class="short-actions">' +
          '<button class="' + (s.liked_by_me ? 'liked' : '') + '" onclick="likeShort(' + s.id + ', this)">&#10084;</button><div class="count">' + s.likes_count + '</div>' +
          '<button onclick="openComments(' + s.id + ')">&#128172;</button><div class="count">' + s.comments_count + '</div>' +
          (s.user.id === myUserId ? ('<button onclick="deleteShort(' + s.id + ')" style="background:rgba(255,0,0,0.3);">&#128465;</button>') : '') +
        '</div></div>';
    }).join('');
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        const video = entry.target.querySelector('video');
        if (entry.isIntersecting) { video.play(); } else { video.pause(); }
      });
    }, { threshold: 0.6 });
    document.querySelectorAll('.short-item').forEach(el => observer.observe(el));
  }
  async function deleteShort(shortId) {
    if (!confirm('Bu videonu silmek isteyirsiniz?')) return;
    await fetch('/api/shorts/remove/' + shortId, { headers: { 'Authorization': 'Bearer ' + token } });
    loadShorts();
  }
  function togglePlay(video) { if (video.paused) video.play(); else video.pause(); }
  async function likeShort(shortId, btn) {
    await apiCall('/api/shorts/like/' + shortId, 'POST');
    loadShorts();
  }
  function openUpload() { document.getElementById('uploadModal').classList.add('open'); }
  function closeUpload() { document.getElementById('uploadModal').classList.remove('open'); }
  function fileToBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }
  async function submitUpload() {
    try {
      const file = document.getElementById('videoInput').files[0];
      if (!file) { alert('Video secilmeyib'); return; }
      alert('Yuklenir, gozleyin...');
      const dataUrl = await fileToBase64(file);
      const caption = document.getElementById('captionInput').value;
      const result = await apiCall('/api/shorts/upload', 'POST', { video_data: dataUrl, caption });
      if (result.error) { alert('Xeta: ' + result.error); return; }
      alert('Yuklendi!');
      closeUpload();
      loadShorts();
    } catch (e) {
      alert('Xeta bawverdi: ' + e.message);
    }
  }
  function openComments(shortId) {
    currentShortId = shortId;
    document.getElementById('commentsPanel').classList.add('open');
    loadShortComments(shortId);
  }
  function closeComments() { document.getElementById('commentsPanel').classList.remove('open'); }
  async function loadShortComments(shortId) {
    const comments = await apiCall('/api/shorts/comments/' + shortId);
    document.getElementById('commentsListShort').innerHTML = comments.map(c =>
      '<div class="comment-row"><b>' + escapeHtml(c.user.display_name || c.user.username) + ':</b> ' + escapeHtml(c.text) + '</div>'
    ).join('');
  }
  async function submitShortComment() {
    const input = document.getElementById('shortCommentInput');
    const text = input.value;
    if (!text.trim() || !currentShortId) return;
    await apiCall('/api/shorts/comment/' + currentShortId, 'POST', { text });
    input.value = '';
    loadShortComments(currentShortId);
    loadShorts();
  }
  loadShorts();
</script>
</body>
</html>
