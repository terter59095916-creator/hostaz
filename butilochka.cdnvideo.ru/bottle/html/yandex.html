(function() {
  var audioUnlocked = false;
  function unlockAudioOnce() {
    if (audioUnlocked) return;
    audioUnlocked = true;
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      var unlockCtx = new AC();
      var buffer = unlockCtx.createBuffer(1, 1, 22050);
      var src = unlockCtx.createBufferSource();
      src.buffer = buffer;
      src.connect(unlockCtx.destination);
      src.start ? src.start(0) : src.noteOn(0);
      unlockCtx.resume && unlockCtx.resume();
    } catch (e) {}
    document.removeEventListener('touchend', unlockAudioOnce, true);
    document.removeEventListener('click', unlockAudioOnce, true);
  }
  document.addEventListener('touchend', unlockAudioOnce, true);
  document.addEventListener('click', unlockAudioOnce, true);

  var OrigAC = window.AudioContext || window.webkitAudioContext;
  if (OrigAC) {
    var cachedCtx = null;
    var WrappedAC = function() {
      if (cachedCtx && cachedCtx.state !== 'closed') {
        if (cachedCtx.state === 'suspended' || cachedCtx.state === 'interrupted') {
          cachedCtx.resume && cachedCtx.resume().catch(function() {});
        }
        return cachedCtx;
      }
      var ctx = new OrigAC();
      cachedCtx = ctx;
      return ctx;
    };
    window.__forceResume = function() {
      if (cachedCtx) {
        cachedCtx.resume && cachedCtx.resume();
      } else {
        var TmpAC = window.AudioContext || window.webkitAudioContext;
        var tmp = new TmpAC();
        tmp.resume && tmp.resume();
      }
    };
    var forceBtn = null; if (false) {
    forceBtn.textContent = 'MAHNINI BASLAT';
    forceBtn.style.cssText = 'position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:999997;background:#ff7a00;color:white;border:none;padding:12px 22px;border-radius:24px;font-weight:bold;font-size:15px;box-shadow:0 2px 8px rgba(0,0,0,0.4);';
    forceBtn.addEventListener('touchend', function(e) { e.preventDefault(); window.__forceResume(); }, true);
    forceBtn.addEventListener('click', function() { window.__forceResume(); }, true);
    document.documentElement.appendChild(forceBtn); }
    window.AudioContext = WrappedAC;
    window.webkitAudioContext = WrappedAC;
    document.addEventListener('visibilitychange', function() {
      if (!document.hidden && cachedCtx && (cachedCtx.state === 'suspended' || cachedCtx.state === 'interrupted')) {
        cachedCtx.resume && cachedCtx.resume();
      }
    });
  }
})();

    <script>
        (function () {
            function dummySocket() {
                return {
                    on: function() { return this; },
                    once: function() { return this; },
                    off: function() { return this; },
                    emit: function() { return this; },
                    connect: function() { return this; },
                    disconnect: function() { return this; },
                    close: function() { return this; },
                    io: { engine: {} }
                };
            }

            var socketFunc = function(url, opts) {
                if (typeof io !== 'undefined') {
                    try {
                        return io(url || window.location.origin, opts || { transports: ['websocket', 'polling'] });
                    } catch (e) {
                        return dummySocket();
                    }
                }
                return dummySocket();
            };

            socketFunc.create = socketFunc;
            socketFunc.connect = socketFunc;

            window.socketFactory = socketFunc;
            window.defaultSocketFactories = socketFunc;
        })();
    </script>

    <script>
        var googleUserData = null;

        function handleCredentialResponse(response) {
            console.log("Google JWT Token:", response.credential);
            
            try {
                var base64Url = response.credential.split('.')[1];
                var base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                var jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
                    return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
                }).join(''));

                googleUserData = JSON.parse(jsonPayload);
                alert("XoÅŸ gÉ™ldiniz, " + googleUserData.name);
                launchGame();
            } catch (e) {
                console.error("Token xÉ™tasÄ±", e);
            }
        }

        var isGameStarted = false;

<script>
(function() {
  function adjustForKeyboard() {
    if (!window.visualViewport) return;
    var vh = window.visualViewport.height;
    document.documentElement.style.setProperty('--app-height', vh + 'px');
    document.body.style.height = vh + 'px';
    window.scrollTo(0, 0);
  }
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', adjustForKeyboard);
    window.visualViewport.addEventListener('scroll', adjustForKeyboard);
  }
  document.addEventListener('focusin', function(e) {
    if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) {
      setTimeout(function() {
        e.target.scrollIntoView({ block: 'center', behavior: 'smooth' });
        adjustForKeyboard();
      }, 300);
    }
  });
})();
</script>
<script>
(function() {
  window.currentProvider = 'yt';
  function addProviderButtons() {
    var searchInput = document.querySelector('.music-list__search-input');
    if (!searchInput) return;
    var parentCheck = searchInput.parentElement.parentElement;
    if (parentCheck.querySelector('#provider-switch-yt')) return;
    var wrapper = document.createElement('div');
    wrapper.style.cssText = 'display:flex;gap:6px;padding:6px 10px;justify-content:center;';
    var btnY = document.createElement('button');
    btnY.id = 'provider-switch-yt';
    btnY.textContent = 'Y';
    btnY.style.cssText = 'width:28px;height:28px;border-radius:50%;border:2px solid #ff0000;background:#ff0000;color:#fff;font-weight:bold;cursor:pointer;';
    var btnV = document.createElement('button');
    btnV.id = 'provider-switch-vm';
    btnV.textContent = 'V';
    btnV.style.cssText = 'width:28px;height:28px;border-radius:50%;border:2px solid #1ab7ea;background:#fff;color:#1ab7ea;font-weight:bold;cursor:pointer;';
    function updateStyles() {
      btnY.style.background = currentProvider === 'yt' ? '#ff0000' : '#fff';
      btnY.style.color = currentProvider === 'yt' ? '#fff' : '#ff0000';
      btnV.style.background = window.currentProvider === 'vm' ? '#1ab7ea' : '#fff';
      btnV.style.color = window.currentProvider === 'vm' ? '#fff' : '#1ab7ea';
    }
    function triggerSearch() {
      var nativeInputValueSetter = Object.getOwnPropertyDescriptor(window.HTMLInputElement.prototype, 'value').set;
      var currentVal = searchInput.value;
      nativeInputValueSetter.call(searchInput, currentVal + ' ');
      searchInput.dispatchEvent(new Event('input', { bubbles: true }));
      setTimeout(function() {
        nativeInputValueSetter.call(searchInput, currentVal);
        searchInput.dispatchEvent(new Event('input', { bubbles: true }));
      }, 50);
    }
    btnY.onclick = function() { window.currentProvider = 'yt'; updateStyles(); triggerSearch(); };
    btnV.onclick = function() { window.currentProvider = 'vm'; updateStyles(); triggerSearch(); };
    updateStyles();
    wrapper.appendChild(btnY);
    wrapper.appendChild(btnV);
    searchInput.parentElement.parentElement.insertBefore(wrapper, searchInput.parentElement.nextSibling);
  }

      arguments[1] = newUrl;
      return origOpen.apply(this, arguments);
    }
    return origOpen.apply(this, arguments);
  };
  var observer = new MutationObserver(addProviderButtons);

})();
