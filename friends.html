<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dostlar</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, sans-serif; background: #f0f2f5; color: #1a1a1a; }
  .header { background: white; padding: 12px 24px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
  .header a { color: #ff7a00; text-decoration: none; font-weight: bold; margin-right: 16px; }
  .container { max-width: 700px; margin: 0 auto; padding: 16px; }
  .search-box { background: white; border-radius: 10px; padding: 16px; margin-bottom: 12px; }
  .search-box input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; }
  .section { background: white; border-radius: 10px; padding: 16px; margin-bottom: 12px; }
  .section h3 { margin-bottom: 10px; color: #444; }
  .user-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid #f0f0f0; }
  .user-avatar { width: 40px; height: 40px; border-radius: 50%; background: #ff7a00; color: white; display: flex; align-items: center; justify-content: center; font-weight: bold; object-fit: cover; }
  .user-name { flex: 1; font-weight: bold; }
  .btn { background: #ff7a00; color: white; border: none; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; }
  .btn:disabled { background: #ccc; cursor: default; }
</style>
</head>
<body>
  <div class="header"><a href="/feed">Lent</a><a href="/game">Oyun</a><a href="/friends">Dostlar</a></div>
  <div class="container">
    <div class="search-box"><input type="text" id="searchInput" placeholder="Istifadeci axtar..." oninput="searchUsers()"></div>
    <div id="searchResults"></div>
    <div class="section"><h3>Dostluq sorgulari</h3><div id="requestsList"></div></div>
    <div class="section"><h3>Dostlarim</h3><div id="friendsList"></div></div>
  </div>
<script>
  const token = localStorage.getItem('authToken');
  if (!token) window.location.href = '/login';
  async function apiCall(url, method) {
    const res = await fetch(url, { method: method || 'GET', headers: { 'Authorization': 'Bearer ' + token } });
    return res.json();
  }
  function escapeHtml(s) { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }
  function userRowHtml(u, actionHtml) {
    const initial = (u.display_name || u.username || '?')[0].toUpperCase();
    const avatarHtml = u.photo_url ? ('<img class="user-avatar" src="' + u.photo_url + '">') : ('<div class="user-avatar">' + initial + '</div>');
    return '<div class="user-row"><a href="/profile?id=' + u.id + '" style="display:contents;text-decoration:none;color:inherit;">' + avatarHtml + '<div class="user-name">' + escapeHtml(u.display_name || u.username) + '</div></a>' + actionHtml + '</div>';
  }
  let searchTimeout;
  function searchUsers() {
    clearTimeout(searchTimeout);
    searchTimeout = setTimeout(async () => {
      const q = document.getElementById('searchInput').value.trim();
      if (!q) { document.getElementById('searchResults').innerHTML = ''; return; }
      const users = await apiCall('/api/users/search?q=' + encodeURIComponent(q));
      document.getElementById('searchResults').innerHTML = users.map(u =>
        userRowHtml(u, '<button class="btn" onclick="sendRequest(' + u.id + ', this)">Dost elave et</button>')
      ).join('');
    }, 300);
  }
  async function sendRequest(userId, btn) {
    await apiCall('/api/friends/request/' + userId, 'POST');
    btn.textContent = 'Gonderildi';
    btn.disabled = true;
  }
  async function acceptRequest(userId, btn) {
    await apiCall('/api/friends/accept/' + userId, 'POST');
    loadAll();
  }
  async function removeFriend(userId) {
    if (!confirm('Bu dostu silmek isteyirsiniz?')) return;
    await apiCall('/api/friends/remove/' + userId);
    loadAll();
  }
  async function loadAll() {
    const requests = await apiCall('/api/friends/requests');
    document.getElementById('requestsList').innerHTML = requests.length ? requests.map(u =>
      userRowHtml(u, '<button class="btn" onclick="acceptRequest(' + u.id + ', this)">Qebul et</button>')
    ).join('') : '<p style="color:#888;">Sorgu yoxdur</p>';
    const friends = await apiCall('/api/friends/list');
    document.getElementById('friendsList').innerHTML = friends.length ? friends.map(u => userRowHtml(u, '<a class="btn" style="text-decoration:none;" href="/messages?with=' + u.id + '">Mesaj yaz</a><button onclick="removeFriend(' + u.id + ')" style="background:#e53935;color:white;border:none;padding:6px 10px;border-radius:6px;cursor:pointer;margin-left:6px;">Sil</button>')).join('') : '<p style="color:#888;">He bir dostun yoxdur</p>';
  }
  loadAll();
</script>
</body>
</html>
